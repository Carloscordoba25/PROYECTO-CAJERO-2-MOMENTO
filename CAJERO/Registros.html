<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registros</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- **************************REGISTRO DE USUSARIO NUEVO***************************** -->

    <!--FORMULARIO DE INGRESO-->
    <div class="auto-emvolver">
        <div class="tarjeta-auto">
            <div class="panel-regitro">
                <div class="logo">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h1>Crear Cuenta</h1>
                <p class="subtitulo">
                    Comienza tu Experiencia con Nosotros
                </p>

                <form>
                    <!--Nombre-->
                    <div class="entrada">
                        <div class="brillo"></div>
                        <div class="bordes"></div>
                        <input type="text" id="entradaNombre" placeholder=" " autocomplete="name" required>
                        <label for="entradaNombre">
                            Nombre Completo
                        </label>
                    </div>

                    <!--Correo-->
                    <div class="entrada">
                        <div class="brillo"></div>
                        <div class="bordes"></div>
                        <input type="email" id="entradaCorreo" placeholder=" " autocomplete="correo" required>
                        <label for="entradaCorreo">
                            Correo Electronico
                        </label>
                    </div>

                    <!--Contraseña-->
                    <div class="entrada">
                        <div class="brillo"></div>
                        <div class="bordes"></div>
                        <input type="password" id="entradaContraseña" placeholder=" " autocomplete="Nueva-Contraseña"
                            required>
                        <label for="entradaContraseña">
                            Contraseña
                        </label>
                        <button type="button" class="Contraseña">
                            <i id="faIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <!--Conformar contraseña-->
                    <div class="entrada">
                        <div class="brillo"></div>
                        <div class="bordes"></div>
                        <input type="password" id="confirmarContraseña" placeholder=" " autocomplete="Nueva-Contraseña"
                            required>
                        <label for="confirmarContraseña">
                            Confirmar Contraseña
                        </label>
                    </div>

                    <button type="submit" class="boton-principal">CREAR CUENTA</button>
                </form>

                <div class="cambio-area">
                    <span>
                        Todo listo con tu cuenta?
                    </span>
                    <button type="button" class="cambio-circulo">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </div>
         </div>   
    </div>       
</body>
</html>
